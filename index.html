<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silvester-Roadtrip: deine Wahl</title>
<style>
  :root {
    --night: #0c1233;
    --deep: #1b2a6b;
    --gold: #f6b85c;
    --rose: #e8557e;
    --ink: #fff6e5;
    --muted: #b9c0e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, var(--deep) 0%, var(--night) 70%);
    color: var(--ink);
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; }
  main { position: relative; width: 100%; max-width: 560px; text-align: center; }
  h1 {
    font-family: Cambria, Georgia, serif;
    font-size: clamp(2.4rem, 9vw, 3.8rem);
    line-height: 1.1;
    margin: 0 0 16px;
    font-weight: 700;
  }
  p { font-size: 1.15rem; line-height: 1.5; color: var(--muted); margin: 0 0 28px; }
  .stage { display: none; }
  .stage.on { display: block; }
  button, .linkbtn {
    font: inherit;
    font-weight: 700;
    font-size: 1.1rem;
    border: 0;
    border-radius: 999px;
    padding: 14px 32px;
    cursor: pointer;
    background: var(--gold);
    color: var(--night);
  }
  button:hover { background: #ffc873; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; }
  .alt { background: transparent; color: var(--muted); font-weight: 400; text-decoration: underline; margin-top: 18px; }
  .alt:hover { background: transparent; color: var(--ink); }
  .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 8px; }
  .cities button { border-radius: 16px; padding: 28px 12px; font-family: Cambria, Georgia, serif; font-size: 1.5rem; color: var(--ink); }
  .c-Prag { background: #8c2a3c; } .c-Prag:hover { background: #a63449; }
  .c-Wien { background: #777777; } .c-Wien:hover { background: #8a8a8a; }
  .c-Amsterdam { background: #0f4c57; } .c-Amsterdam:hover { background: #17606d; }
  .c-Berlin { background: #4a4c85; } .c-Berlin:hover { background: #5a5da0; }
  .err { color: #ffb3c4; margin-top: 18px; font-size: 1rem; }
  @media (prefers-reduced-motion: reduce) { canvas#fx { display: none; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>

  <section id="confirm" class="stage">
    <h1 id="confirmTitle">Prag?</h1>
    <p>Dann schick mir jetzt deine Wahl, damit ich den Trip buchen kann.</p>
    <button id="send" type="button">Wahl abschicken</button>
    <div><button id="other" class="alt" type="button">Doch lieber woanders?</button></div>
    <div id="err" class="err" role="alert" hidden>Das hat nicht geklappt. Schreib mir bitte kurz, wohin es gehen soll.</div>
  </section>

  <section id="pick" class="stage">
    <h1>Wohin soll’s gehen?</h1>
    <p>Tipp auf die Stadt, die du dir wünschst.</p>
    <div class="cities">
      <button type="button" class="c-Prag" data-city="Prag">Prag</button>
      <button type="button" class="c-Wien" data-city="Wien">Wien</button>
      <button type="button" class="c-Amsterdam" data-city="Amsterdam">Amsterdam</button>
      <button type="button" class="c-Berlin" data-city="Berlin">Berlin</button>
    </div>
  </section>

  <section id="done" class="stage">
    <h1 id="doneTitle">Angekommen!</h1>
    <p>Ich hab’s bekommen. Wir fahren nach <strong id="doneCity"></strong>.</p>
  </section>

</main>

<script>
(function () {
  // Hier den Schlüssel von web3forms.com einfügen (zwischen den Anführungszeichen).
  var ACCESS_KEY = "38fe919a-f4cb-460c-b2fe-8dcb64fced4f";

  var CITIES = ["Prag", "Wien", "Amsterdam", "Berlin"];
  var city = null;

  function show(id) {
    ["confirm", "pick", "done"].forEach(function (s) {
      document.getElementById(s).classList.toggle("on", s === id);
    });
  }

  function choose(c) {
    city = c;
    document.getElementById("confirmTitle").textContent = c + "?";
    document.getElementById("err").hidden = true;
    show("confirm");
  }

  var params = new URLSearchParams(location.search);
  var fromLink = params.get("stadt");
  var match = CITIES.filter(function (c) { return fromLink && c.toLowerCase() === fromLink.toLowerCase(); })[0];
  if (match) { choose(match); } else { show("pick"); }

  document.querySelectorAll(".cities button").forEach(function (b) {
    b.addEventListener("click", function () { choose(b.getAttribute("data-city")); });
  });
  document.getElementById("other").addEventListener("click", function () { show("pick"); });

  document.getElementById("send").addEventListener("click", function () {
    var btn = this;
    var err = document.getElementById("err");
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = "Wird geschickt …";

    fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        access_key: ACCESS_KEY,
        subject: "Silvester-Roadtrip: Sie hat " + city + " gewählt",
        from_name: "Roadtrip-Seite",
        message: "Ihre Wahl: " + city,
        botcheck: ""
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.success) { throw new Error(data.message || "fehlgeschlagen"); }
      document.getElementById("doneCity").textContent = city;
      show("done");
      burst();
    })
    .catch(function () {
      btn.disabled = false;
      btn.textContent = "Nochmal versuchen";
      err.hidden = false;
    });
  });

  // Feuerwerk als Antwort auf den erfolgreichen Klick
  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");
  var parts = [];
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener("resize", resize); resize();

  function burst() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
    var colors = ["#f6b85c", "#e8557e", "#fff6e5", "#7fb5ff"];
    for (var k = 0; k < 4; k++) {
      var x = innerWidth * (0.2 + Math.random() * 0.6);
      var y = innerHeight * (0.15 + Math.random() * 0.35);
      for (var i = 0; i < 70; i++) {
        var a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 4;
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                     life: 1, c: colors[(Math.random() * colors.length) | 0] });
      }
    }
    requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.985; p.life -= 0.012;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, 3, 3);
    });
    ctx.globalAlpha = 1;
    if (parts.length) { requestAnimationFrame(tick); }
  }
})();
</script>
</body>
</html>
